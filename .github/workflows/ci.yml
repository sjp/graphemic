name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Segmentation comes from the runtime's ICU data, so record which version
      # produced this run: a failure on one Node major is then traceable to a
      # Unicode data change rather than to a change in this library.
      - name: Report ICU and Unicode versions
        run: node -e "console.log(process.versions.icu, process.versions.unicode)"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Ten times the local number of generated cases per property: still a few
      # seconds, and the extra runs are what turn a rare input into a failure
      # here rather than in someone's application.
      - run: npm run test:coverage
        env:
          PROPERTY_RUNS: 5000
      - run: npm run build
      # The benchmarks are never run here — they are far too noisy to gate a merge
      # on, and their numbers are recorded by hand in bench/RESULTS.md — but they
      # are compiled against the build they measure, so they cannot rot unnoticed.
      - run: npm run typecheck:bench
      - run: npm run lint:package

  # Guard the two promises that are easy to break by accident: no runtime
  # dependencies, and a package small enough that it cannot be carrying
  # bundled Unicode tables.
  package:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect package contents and size
        run: node .github/scripts/check-package.mjs
